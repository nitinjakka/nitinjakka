<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Timer — 10 / 3 / 2</title>
<style>
  :root {
    --bg: #0f1220;
    --card: #1a1f35;
    --text: #eef1ff;
    --muted: #8b93b5;
    --accent: #4f7cff;
    --warn: #ffb020;
    --danger: #ff5a5a;
    --ok: #35c37d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 40px 48px;
    width: 100%;
    max-width: 520px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  h1 { font-size: 1.1rem; font-weight: 600; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }

  .stages {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 22px 0 28px;
  }
  .stage {
    flex: 1;
    padding: 10px 8px;
    border-radius: 12px;
    background: rgba(255,255,255,.05);
    border: 2px solid transparent;
    color: var(--muted);
    font-size: .9rem;
  }
  .stage .label { font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; }
  .stage .mins  { font-size: 1.25rem; font-weight: 700; margin-top: 2px; }
  .stage.active { border-color: var(--accent); color: var(--text); background: rgba(79,124,255,.12); }
  .stage.done   { color: var(--ok); background: rgba(53,195,125,.10); }
  .stage.done .mins::after { content: " ✓"; }

  #time {
    font-size: clamp(4rem, 18vw, 7rem);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    letter-spacing: .02em;
  }
  #time.warn   { color: var(--warn); }
  #time.danger { color: var(--danger); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .45; } }

  #status { margin-top: 10px; color: var(--muted); min-height: 1.4em; }

  .bar {
    height: 8px;
    background: rgba(255,255,255,.08);
    border-radius: 999px;
    margin: 24px 0 30px;
    overflow: hidden;
  }
  #fill {
    height: 100%;
    width: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width .25s linear, background .3s;
  }

  .controls { display: flex; gap: 12px; justify-content: center; }
  button {
    font-size: 1rem;
    font-weight: 600;
    padding: 12px 28px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: #fff;
    background: rgba(255,255,255,.10);
    transition: transform .08s, filter .15s;
  }
  button:hover { filter: brightness(1.15); }
  button:active { transform: scale(.97); }
  #startBtn { background: var(--accent); min-width: 130px; }
  #startBtn.running { background: var(--warn); color: #201500; }
</style>
</head>
<body>
<div class="card">
  <h1>Countdown Timer</h1>

  <div class="stages" id="stages"></div>

  <div id="time">10:00</div>
  <div id="status">Ready — Stage 1 of 3</div>

  <div class="bar"><div id="fill"></div></div>

  <div class="controls">
    <button id="startBtn">Start</button>
    <button id="resetBtn">Reset</button>
  </div>
</div>

<script>
  const STAGES = [10 * 60, 3 * 60, 2 * 60]; // seconds: 10 min, 3 min, 2 min

  let stageIndex = 0;
  let remaining = STAGES[0];
  let deadline = null;   // timestamp when current stage ends
  let running = false;
  let tickHandle = null;

  const timeEl   = document.getElementById('time');
  const statusEl = document.getElementById('status');
  const fillEl   = document.getElementById('fill');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const stagesEl = document.getElementById('stages');

  // Build stage chips
  STAGES.forEach((secs, i) => {
    const div = document.createElement('div');
    div.className = 'stage';
    div.id = 'stage' + i;
    div.innerHTML = '<div class="label">Stage ' + (i + 1) + '</div>' +
                    '<div class="mins">' + (secs / 60) + ' min</div>';
    stagesEl.appendChild(div);
  });

  function fmt(secs) {
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function beep(times) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      for (let i = 0; i < times; i++) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 880;
        const t = ctx.currentTime + i * 0.35;
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
        osc.start(t); osc.stop(t + 0.3);
      }
    } catch (e) { /* audio not available; timer still works */ }
  }

  function render() {
    timeEl.textContent = fmt(remaining);
    timeEl.className = remaining <= 10 && running ? 'danger'
                     : remaining <= 60 ? 'warn' : '';
    fillEl.style.width = (remaining / STAGES[stageIndex] * 100) + '%';
    fillEl.style.background = remaining <= 10 ? 'var(--danger)'
                            : remaining <= 60 ? 'var(--warn)' : 'var(--accent)';
    STAGES.forEach((_, i) => {
      const el = document.getElementById('stage' + i);
      el.className = 'stage' + (i < stageIndex ? ' done'
                              : i === stageIndex ? ' active' : '');
    });
  }

  function tick() {
    remaining = Math.max(0, Math.round((deadline - Date.now()) / 1000));
    render();
    if (remaining > 0) return;

    // Stage finished
    if (stageIndex < STAGES.length - 1) {
      beep(2);
      stageIndex++;
      remaining = STAGES[stageIndex];
      deadline = Date.now() + remaining * 1000;
      statusEl.textContent = 'Running — Stage ' + (stageIndex + 1) + ' of ' + STAGES.length;
      render();
    } else {
      beep(4);
      stop();
      stageIndex = STAGES.length; // mark all done
      statusEl.textContent = 'All stages complete! 🎉';
      timeEl.textContent = '00:00';
      startBtn.textContent = 'Start';
      startBtn.classList.remove('running');
      render();
    }
  }

  function start() {
    if (stageIndex >= STAGES.length) reset(); // finished → restart from stage 1
    running = true;
    deadline = Date.now() + remaining * 1000;
    tickHandle = setInterval(tick, 250);
    startBtn.textContent = 'Pause';
    startBtn.classList.add('running');
    statusEl.textContent = 'Running — Stage ' + (stageIndex + 1) + ' of ' + STAGES.length;
    document.getElementById('stage' + stageIndex).classList.add('active');
  }

  function stop() {
    running = false;
    clearInterval(tickHandle);
  }

  function pause() {
    stop();
    startBtn.textContent = 'Resume';
    startBtn.classList.remove('running');
    statusEl.textContent = 'Paused — Stage ' + (stageIndex + 1) + ' of ' + STAGES.length;
  }

  function reset() {
    stop();
    stageIndex = 0;
    remaining = STAGES[0];
    startBtn.textContent = 'Start';
    startBtn.classList.remove('running');
    statusEl.textContent = 'Ready — Stage 1 of 3';
    render();
  }

  startBtn.addEventListener('click', () => running ? pause() : start());
  resetBtn.addEventListener('click', reset);

  // Space bar toggles start/pause, R resets
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); running ? pause() : start(); }
    if (e.key === 'r' || e.key === 'R') reset();
  });

  render();
</script>
</body>
</html>
